# ================================================================
# DailyNews 配置文件 — 基于 TrendRadar v6.6.0
# 
# ⚠️ 此文件在 Fork 后需要覆盖到你的 GitHub 仓库的 config/config.yaml
# ⚠️ 敏感信息（API Key、Webhook URL）通过 GitHub Secrets 环境变量注入
#    不要在此文件中填写真实密钥！
# ================================================================

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# ================================================================
# 调度系统：早晚汇总模式（早上+晚上各推送一次）
# 可选预设：always_on | morning_evening | office_hours | night_owl | custom
# ================================================================
schedule:
  enabled: true
  preset: "morning_evening"

# ================================================================
# 热榜平台配置
# 根据你的兴趣开启/关闭平台，减少不相关的信息噪音
# ================================================================
platforms:
  enabled: true
  sources:
    - id: "toutiao"
      name: "今日头条"
    - id: "baidu"
      name: "百度热搜"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
    - id: "weibo"
      name: "微博"
    - id: "zhihu"
      name: "知乎"
    - id: "douyin"
      name: "抖音"

# ================================================================
# RSS 订阅源配置
# ================================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1

  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"

    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/rssindex"

# ================================================================
# 报告模式配置
# ================================================================
report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

# ================================================================
# 筛选方式：AI 智能筛选（推荐）
# 如果不想用 AI 筛选，改成 "keyword" 使用关键词匹配
# ================================================================
filter:
  method: "ai"
  priority_sort_enabled: true

# ================================================================
# AI 筛选配置
# ================================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.6
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ================================================================
# 显示配置
# ================================================================
display:
  region_order:
    - new_items
    - hotlist
    - rss
    - standalone
    - ai_analysis

  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true

  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]
    rss_feeds: []
    max_items: 20

# ================================================================
# 推送通知配置
# ⚠️ 所有 webhook/token 留空！通过 GitHub Secrets 环境变量注入
# ================================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""               # 环境变量: FEISHU_WEBHOOK_URL

    dingtalk:
      webhook_url: ""               # 环境变量: DINGTALK_WEBHOOK_URL

    wework:
      webhook_url: ""               # 环境变量: WEWORK_WEBHOOK_URL
      msg_type: "markdown"

    telegram:
      bot_token: ""                 # 环境变量: TELEGRAM_BOT_TOKEN
      chat_id: ""                   # 环境变量: TELEGRAM_CHAT_ID

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""                       # 环境变量: BARK_URL

    slack:
      webhook_url: ""               # 环境变量: SLACK_WEBHOOK_URL

    # ============================================================
    # 🔥 PushPlus 微信推送（通过通用 Webhook 实现）
    # 这是推送到个人微信的最佳方案，无需企业微信
    # 环境变量: GENERIC_WEBHOOK_URL + GENERIC_WEBHOOK_TEMPLATE
    # 详见 docs/wechat_push_guide.md
    # ============================================================
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ================================================================
# 存储配置
# ================================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# ================================================================
# AI 模型配置（LiteLLM 格式）
# ⚠️ API Key 通过 GitHub Secrets 的 AI_API_KEY 注入
# ================================================================
ai:
  model: "deepseek/deepseek-chat"
  api_key: ""                         # 环境变量: AI_API_KEY
  api_base: ""                        # 环境变量: AI_API_BASE（通常留空）
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []

# ================================================================
# AI 分析配置
# ================================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: false
  include_standalone: true
  include_rank_timeline: true

# ================================================================
# AI 翻译配置
# ================================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false
    rss: true
    standalone: true

# ================================================================
# 高级设置（一般不需要修改）
# ================================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
